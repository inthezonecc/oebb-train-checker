# Euro pricing and ÖBB Train Checker Sensors
sensor:
  - platform: template
    sensors:
      solar_saving_total_old_price:
        friendly_name: "Euros saved using Solar total old price"
        unique_id: euros_saved_using_solar_total_old_price
        unit_of_measurement: '€'
        icon_template: mdi:currency-eur
        value_template: >-
          {{ ((states('sensor.hoymiles_1600_yieldtotal') | float * 0.40) )| round(2)  }}

  - platform: template
    sensors:
      solar_saving_total_new_price:
        friendly_name: "Euros saved using Solar total new price"
        unique_id: euros_saved_using_solar_total_new_price
        unit_of_measurement: '€'
        icon_template: mdi:currency-eur
        value_template: >-
          {{ ((states('sensor.hoymiles_1600_yieldtotal') | float * 0.13) )| round(2)  }}

  - platform: template
    sensors:
      solar_saving_daily_old_price:
        friendly_name: "Euros saved using Solar day old price"
        unique_id: euros_saved_using_solar_day_old_price
        unit_of_measurement: '€'
        icon_template: mdi:currency-eur
        value_template: >-
          {{ ((states('sensor.hoymiles_1600_yieldday') | float * 0.40) )| round(2)  }}

  - platform: template
    sensors:
      solar_saving_daily_new_price:
        friendly_name: "Euros saved using Solar day new price"
        unique_id: euros_saved_using_solar_day_new_price
        unit_of_measurement: '€'
        icon_template: mdi:currency-eur
        value_template: >-
          {{ ((states('sensor.hoymiles_1600_yieldday') | float * 0.13) )| round(2)  }}

  # TEST SENSOR - Remove after testing
  - platform: rest
    name: Test REST Sensor
    resource: http://httpbin.org/json
    scan_interval: 60
    value_template: "{{ value_json.slideshow.title | default('Test Working') }}"

  # ÖBB Train Checker Sensors
  - platform: rest
    name: OEBB Trains
    resource: http://localhost:3000/api/trains
    scan_interval: 300
    json_attributes:
      - trains
      - from
      - to
      - count
      - lastUpdate
      - status
    value_template: "{{ value_json.status }}"

  - platform: rest
    name: OEBB Next Train
    resource: http://localhost:3000/api/trains/next
    scan_interval: 300
    json_attributes:
      - train
      - lastUpdate
      - status
    value_template: >
      {% if value_json and value_json.train and value_json.train.line and value_json.train.departure and value_json.train.departure.time %}
        {{ value_json.train.line }} at {{ as_timestamp(value_json.train.departure.time) | timestamp_custom('%H:%M') }}
      {% else %}
        No trains
      {% endif %}

  - platform: rest
    name: OEBB Next Train Line
    resource: http://localhost:3000/api/trains/next
    scan_interval: 300
    value_template: >
      {% if value_json and value_json.train and value_json.train.line %}
        {{ value_json.train.line }}
      {% else %}
        N/A
      {% endif %}

  - platform: rest
    name: OEBB Next Train Departure
    resource: http://localhost:3000/api/trains/next
    scan_interval: 300
    value_template: >
      {% if value_json.train and value_json.train.departure.time %}
        {{ as_timestamp(value_json.train.departure.time) | timestamp_custom('%H:%M') }}
      {% else %}
        N/A
      {% endif %}

  - platform: rest
    name: OEBB Next Train Delay
    resource: http://localhost:3000/api/trains/next
    scan_interval: 300
    unit_of_measurement: "min"
    value_template: >
      {% if value_json and value_json.train and value_json.train.departure and value_json.train.departure.delayMinutes %}
        {{ value_json.train.departure.delayMinutes }}
      {% else %}
        0
      {% endif %}

  - platform: rest
    name: OEBB Next Train Cancelled
    resource: http://localhost:3000/api/trains/next
    scan_interval: 300
    value_template: >
      {% if value_json and value_json.train and value_json.train.cancelled %}
        {{ value_json.train.cancelled }}
      {% else %}
        false
      {% endif %}

  - platform: rest
    name: OEBB Next Train Platform
    resource: http://localhost:3000/api/trains/next
    scan_interval: 300
    value_template: >
      {% if value_json and value_json.train and value_json.train.departure and value_json.train.departure.platform %}
        {{ value_json.train.departure.platform }}
      {% else %}
        N/A
      {% endif %}

  - platform: rest
    name: OEBB Next Train Arrival
    resource: http://localhost:3000/api/trains/next
    scan_interval: 300
    value_template: >
      {% if value_json.train and value_json.train.arrival.time %}
        {{ as_timestamp(value_json.train.arrival.time) | timestamp_custom('%H:%M') }}
      {% else %}
        N/A
      {% endif %}

